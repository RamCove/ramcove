# RamCove public API for the hosted web app (ramcove.vercel.app).
#
# A separate port on this host's Let's Encrypt IP certificate; it does not change any other site. Only
# requests carrying the proxy key (held by the RamCove web servers) get through, and every request is
# stamped as coming through the public door, which the API uses to refuse operator-only actions.
#
# The key check lives in /etc/nginx/ramcove/proxy-key.conf (mode 600), never in this repository:
#   if ($http_x_ramcove_proxy_key != "<the key>") { return 403; }
# A per-site comparison rather than a map, so no server-wide nginx setting has to change.

limit_req_zone $binary_remote_addr zone=ramcove_rl:10m rate=20r/s;

server {
    listen 8788 ssl http2;
    listen [::]:8788 ssl http2;
    server_name 158.220.118.14;

    ssl_certificate     /etc/letsencrypt/live/158.220.118.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/158.220.118.14/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 256k;
    limit_req zone=ramcove_rl burst=40 nodelay;

    include /etc/nginx/ramcove/proxy-key.conf;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-RamCove-Channel public;
        proxy_set_header X-RamCove-Proxy-Key "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
