name: CI

# Least privilege: the workflow only reads the repository. It never needs production secrets, and no job
# exposes anything to untrusted pull-request code.
permissions:
  contents: read

on:
  push:
    branches: ["room/**", "main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, unit, database-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: room
          POSTGRES_PASSWORD: room-local-dev-only
          POSTGRES_DB: room
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U room -d room"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ROOM_ENV: test
      ROOM_DATABASE_URL: postgresql+psycopg://room:room-local-dev-only@127.0.0.1:5432/room
      ROOM_TEST_DATABASE_URL: postgresql+psycopg://room:room-local-dev-only@127.0.0.1:5432/room_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check packages services miner_cli tests
      - name: Create the test database
        run: PGPASSWORD=room-local-dev-only psql -h 127.0.0.1 -U room -d room -c "CREATE DATABASE room_test OWNER room"
      - name: Unit tests (no database)
        run: uv run pytest -q tests/unit
      - name: Integration tests (PostgreSQL)
        run: uv run pytest -q tests/integration
      # Real-GPU, testnet and public-RPC suites are selected explicitly and are not run here.

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Look for credentials in the tree
        run: |
          set -euo pipefail
          # Development key URIs (//RoomDemo...) are published on purpose and are excluded by name.
          if grep -rInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv . ; then
            echo "::error::possible credential found"
            exit 1
          fi
          echo "no credential patterns found"
